# Builds and publishes a release when a v* tag arrives (pushed by PolyPack's
# split workflow, from a cli-v* tag there). Lives in cli/.github/workflows/ in
# PolyPack's repository; edit it there.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Step 75: the exchange for a Publisher Token of PolyPack's polypack-cli.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/polypack-$os-$arch$ext" .
          done
          (cd dist && sha256sum polypack-* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A pre-release (v0.8.0-beta.1) is never GitHub's "latest", which every
        # CLI on the stable channel falls back to.
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "polypack $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
      # Step 75 (ADR-0036 § 9): the same binaries, as a Version of the public
      # Files Pack polypack-cli on Cool Studio's Team, with trusted
      # publishing: no secret. The binary just built does it. SHA256SUMS stays
      # out: PolyPack generates and signs its own. v0.9.0 (step 77) is the
      # last release to reach GitHub too (ADR-0037); from step 78 releases are
      # built in polypack-v2 and go to PolyPack only.
      - name: Exchange for a Publisher Token of polypack-cli
        run: ./dist/polypack-linux-amd64 ci polypack-cli --team cool-studio --files
      - name: Publish to PolyPack
        # install.sh too (step 77): polypack.io/install.sh redirects to the
        # latest Version's copy, so each release ships the script that installs it.
        run: ./dist/polypack-linux-amd64 files upload "polypack-cli@${GITHUB_REF_NAME}" 'dist/polypack-*' install.sh --team cool-studio --publish
